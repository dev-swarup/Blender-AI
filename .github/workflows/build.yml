name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6
      - name: Download Blender
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ
          echo "BLENDER=$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Vendor wheels for every platform
        run: |
          pip install uv
          python scripts/vendor_wheels.py
      - name: Build per-platform zips
        run: python scripts/build.py --blender "$BLENDER"
      - uses: actions/upload-artifact@v4
        with:
          name: blender_ai-zips
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
